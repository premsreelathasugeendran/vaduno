name: Publish

# Publishes all seven packages to npm via npm Trusted Publishing (GitHub OIDC).
#
# WHY OIDC AND NOT A TOKEN: npm's web-login tokens are short-lived, so a manual
# `npm publish` needs a fresh browser 2FA round every few hours — that bit this
# project three times in one day, once leaving a release with two known cap
# bypasses as `latest` while the fix sat unpublished. npm is also actively
# restricting tokens that bypass 2FA for direct publishing, so an automation
# token is a dead end. OIDC has no secret to expire, store, or leak: GitHub
# mints a short-lived identity token per run and npm verifies it came from THIS
# repo and THIS workflow file.
#
# It also produces provenance attestation, which cannot be added to a version
# retroactively.
#
# ── ONE-TIME SETUP, per package, on npmjs.com ────────────────────────────────
# For each of @vaduno/{guard,transparency,revocation,x402,stripe,postgres,agent}:
#   Package page → Settings → Publishing access → Trusted publisher → GitHub Actions
#     Organization or user : premsreelathasugeendran
#     Repository           : vaduno
#     Workflow filename    : publish.yml      <-- must match THIS file's name
#     Environment          : (leave empty)
# Until that is configured for a package, its publish step fails with E404 —
# npm returns 404 rather than 401 for an unauthorized PUT.
#
# ⚠ A BRAND-NEW package has no npm page yet, so there is nothing to configure a
# trusted publisher ON. @vaduno/agent is in that state: it must be published
# once by hand (browser 2FA) to create the package, and only then can its
# Trusted publisher be set for every release after. Do NOT expect this workflow
# to publish @vaduno/agent successfully on its first run.
#
# ── RELEASING ────────────────────────────────────────────────────────────────
#   1. bump versions, commit, `git tag -a v0.2.2 -m "..."`, push both
#   2. this workflow verifies, then publishes @vaduno/guard FIRST and the rest after
# Or run it manually from the Actions tab with dry_run to rehearse.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and `npm publish --dry-run`, publishing nothing"
        type: boolean
        default: true

permissions:
  contents: read

# Never let two publish runs interleave. A partial publish is recoverable only
# by burning version numbers, since name@version can never be reused.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    # The publish gate is deliberately stricter than CI: it also proves the
    # Postgres stores are atomic against a real database, because those are the
    # packages whose whole value is a concurrency guarantee.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaduno_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Tag must match the version being published
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./packages/guard/package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match @vaduno/guard@$PKG — refusing to publish"
            exit 1
          fi

      - name: All six packages must share one version
        run: |
          set -euo pipefail
          VERSIONS=$(for d in packages/*/; do
            node -p "require('./$d/package.json').private === true ? '' : require('./$d/package.json').version" 2>/dev/null
          done | grep -v '^$' | sort -u)
          echo "$VERSIONS"
          if [ "$(echo "$VERSIONS" | wc -l)" -ne 1 ]; then
            echo "::error::packages disagree on version — they release as a matched set"
            exit 1
          fi

      - run: npm run build

      - name: Tests (all six packages)
        run: npm run test

      - name: Postgres conformance against a real database
        run: npm -w @vaduno/postgres run test
        env:
          VADUNO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/vaduno_test

      - name: Demos must actually run
        run: |
          npm run demo
          npm run demo:x402
          npm run demo:stripe
          npm run demo:transparency
          npm run demo:revocation
          npm run demo:cross-process

      - name: Release gate
        run: node scripts/check-release.mjs

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point. Lets GitHub mint the OIDC token npm exchanges for
      # short-lived publish rights. Without it every publish is E404.
      id-token: write
    # Job-level so the `if:` on the verify step can actually see it. A
    # step-level env is not in scope for that step's own condition.
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v5

      # Node 24, not 20: npm 12 requires ^22.22.2 || ^24.15.0 || >=26, so a
      # Node 20 runner cannot install a current npm at all.
      #
      # NOTE: deliberately NO `registry-url`. Setting it makes setup-node write
      # an .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # — and with NODE_AUTH_TOKEN unset that becomes an EMPTY token. npm then
      # authenticates with nothing instead of falling through to OIDC, and the
      # registry answers E404 ("could not be found or you do not have permission").
      # Provenance still signs fine, because that uses a Sigstore-audience token,
      # which is why the failure looks like a permissions problem rather than a
      # configuration one. registry.npmjs.org is the default registry anyway.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # Trusted publishing needs npm >= 11.5.1, and setup-node may ship older.
      #
      # PINNED, not @latest. The first run of this workflow failed exactly here:
      # `npm@latest` resolved to npm 12, which refuses to run on Node 20. An
      # unpinned tool in a release pipeline means a stranger's release can break
      # your release, at the moment you least want to debug it.
      - name: Ensure npm supports trusted publishing
        run: |
          # npm 12: npm 11.19.0 reached ENEEDAUTH without ever attempting an
          # OIDC exchange, so treat 12 as the floor. Node 24 above is what makes
          # 12 installable at all. Pinned to a MAJOR, not @latest — an unpinned
          # tool in a release pipeline lets someone else's release break yours.
          npm install -g npm@^12
          npm --version
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim();
            const maj = Number(v.split(".")[0]);
            if (maj < 12) { console.error(`::error::npm ${v} predates reliable OIDC trusted publishing`); process.exit(1); }
            console.log(`npm ${v}`);
          '

      # If a token is configured — even an empty one — npm uses it instead of
      # OIDC and the failure is an opaque E404. Print what npm actually sees so
      # the next person does not have to infer it from a 404.
      - name: Show npm auth configuration (no secrets to leak — there is no token)
        run: |
          echo "registry: $(npm config get registry)"
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- userconfig .npmrc ---"
            sed 's/\(_authToken=\).*/\1<redacted-or-empty>/' "$NPM_CONFIG_USERCONFIG"
          else
            echo "no userconfig .npmrc — good, npm should use OIDC"
          fi
          # If these are absent, id-token: write is not in effect and OIDC
          # cannot happen regardless of npm version or registry config.
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"

      - run: npm ci
      - run: npm run build

      # @vaduno/guard MUST land first: the other five declare a hard dependency
      # on ^<this version>, so any of them published first is uninstallable
      # (ETARGET) until guard exists.
      - name: Publish @vaduno/guard
        run: node scripts/publish-ordered.mjs guard
        env:
          VADUNO_PUBLISH_TRACE: "1"

      # Derived from the filesystem, never hand-listed. v0.7.0 shipped with
      # @vaduno/cloudflare missing from a hardcoded list here: the workflow
      # predated the package, published the seven it knew about, and reported
      # success — the exact "reports success while dropping what it did not
      # handle" failure this project keeps finding elsewhere. A list that has to
      # be remembered will eventually be forgotten, so it is computed instead.
      - name: Publish every dependent
        run: node scripts/publish-ordered.mjs $(ls packages | grep -v '^guard$' | tr '\n' ' ')

      - name: Confirm the registry agrees
        if: env.DRY_RUN != 'true'
        run: node scripts/publish-ordered.mjs --verify $(ls packages | tr '\n' ' ')
