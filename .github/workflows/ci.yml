name: CI

on:
  push:
    # Release branches too, not just master. Four commits' worth of
    # concurrency work — a rewritten LedgerStore contract and a cross-process
    # kill switch — once landed on release/0.3.0 with CI never running at all,
    # which meant the postgres job below (the ONLY live-database proof this
    # repo has) had not executed for either new store when they were written.
    # A guarantee CI could have checked and didn't is worse than no CI.
    branches: [master, "release/**"]
  pull_request:
  # Weekly, so a break caused by something outside the repo (a transitive
  # dependency, a Node release) surfaces on its own rather than the next time
  # someone happens to push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in every package's engines field; 24 is
        # current. Both are tested because the packages use node:crypto
        # directly and Ed25519/webcrypto behaviour has moved between releases.
        node: ["18", "20", "22", "24"]
        os: [ubuntu-latest]
        include:
          # The file-backed stores (JsonlLedgerStore, FileConsumeStore,
          # FileApprovalStore) do atomic temp-file + rename and O_EXCL
          # lockfiles, whose semantics genuinely differ on Windows. This is
          # also the maintainer's daily driver, so it must stay green.
          - node: "20"
            os: windows-latest
          - node: "20"
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Test all packages
        run: npm run test

  demos:
    name: demos actually run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # A green test suite does not prove the documented entry points work.
      # Every demo is a scenario from the README; if one throws, the README
      # is lying to a new reader.
      - run: npm run demo
      - run: npm run demo:x402
      - run: npm run demo:stripe
      - run: npm run demo:transparency
      - run: npm run demo:revocation
      # Spawns two real OS processes racing one cap, and exits non-zero if the
      # shared limiter ever lets total spend past it. This is the guarantee the
      # project's headline claim rests on, so CI proves it on every push —
      # including on Windows, where the lockfile semantics differ.
      - run: npm run demo:cross-process

  postgres:
    name: postgres conformance (real database)
    runs-on: ubuntu-latest
    # @vaduno/postgres exists to be atomic across instances, and that property
    # lives in Postgres — in pg_advisory_xact_lock, in transaction boundaries,
    # in what a pooled connection is. A mock would prove nothing, so the
    # conformance suites run against a real server or they do not run at all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaduno_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every Postgres-backed store's conformance suite: SpendLimiter,
      # ConsumeStore, LedgerStore and FreezeStore. The last two are new in
      # 0.3.0 and this job is their ONLY live-database evidence — everywhere
      # else the suite is env-gated and skips, so their correctness otherwise
      # rests on reading the SQL. If this job is red, the claims in
      # SECURITY.md about those two stores are not backed by anything.
      - name: All store conformance suites against a real Postgres
        run: npm -w @vaduno/postgres run test
        env:
          VADUNO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/vaduno_test

  publishable:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Catches the mistakes that are expensive precisely because npm
      # publishes are permanent: a missing README or LICENSE in the tarball,
      # source or tests leaking into a package, a stale dist/, an internal
      # dependency on "*", or a scoped package that would publish private.
      - run: node scripts/check-release.mjs

  # The dashboard had ZERO CI coverage — it is the one workspace nothing
  # built, so a break in it shipped undetected until someone ran it by hand.
  # It is private and never published, but it is the only thing a visitor
  # actually looks at, and it is where every third-party dependency in this
  # repo lives.
  dashboard:
    name: dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run dashboard:build
        env:
          # The app refuses to start without a high-entropy session secret
          # (fail closed by design, lib/auth.ts); CI supplies a throwaway so
          # the build is exercised rather than skipped. This value never
          # guards anything — no CI artifact is served.
          VADUNO_SESSION_SECRET: ci-build-only-not-a-real-secret-0123456789

  # Enforces the property the whole project rests on: the published packages
  # have NO third-party runtime dependencies, so an installing user receives no
  # third-party code and no advisory can reach them through @vaduno/*. The
  # assertion is the gate; the audit beside it is informational, because it
  # necessarily includes the private dashboard's toolchain.
  supply-chain:
    name: published packages ship no third-party code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # THE GATE. Every published package declares zero third-party runtime
      # dependencies, so an installing user receives no third-party code at
      # all and no advisory can reach them through these packages. That makes
      # this assertion both necessary and sufficient, and it is why it runs
      # BEFORE the audit below.
      #
      # An earlier version of this job ran `npm audit -w @vaduno/<pkg>` per
      # package and treated a clean result as proof. It is not: `-w` does not
      # scope an audit to that workspace's dependency tree — it audits the
      # whole lockfile and merely runs from the workspace directory. It
      # reported a postcss advisory against @vaduno/guard, a package with no
      # dependencies whatsoever. A gate that answers a question you did not
      # ask is worse than no gate, because its green tick is believed.
      - name: Published packages declare no third-party runtime deps
        run: |
          node -e '
            const { readdirSync, readFileSync, existsSync } = require("node:fs");
            const bad = [];
            for (const name of readdirSync("packages")) {
              const p = `packages/${name}/package.json`;
              if (!existsSync(p)) continue;
              const pkg = JSON.parse(readFileSync(p, "utf8"));
              if (pkg.private) continue;
              for (const dep of Object.keys(pkg.dependencies ?? {})) {
                if (!dep.startsWith("@vaduno/")) bad.push(`${pkg.name} -> ${dep}`);
              }
            }
            if (bad.length) {
              console.error("::error::third-party runtime dependency added: " + bad.join(", "));
              console.error("::error::this is a design change, not a routine bump — zero-dependency is a stated property of @vaduno/guard and the reason its supply chain is auditable by reading it");
              process.exit(1);
            }
            console.log("all published packages: zero third-party runtime deps");
          '

      # VISIBILITY, NOT A GATE. This necessarily includes apps/dashboard —
      # private, never published — whose Next toolchain is where every
      # third-party dependency in this repo lives. A new advisory there is
      # worth seeing on every run, and worth fixing, but it does not reach a
      # single installing user, so it must not redden master and train
      # everyone to ignore this job.
      - name: Advisories in the repo's own toolchain (informational)
        continue-on-error: true
        run: npm audit --audit-level=moderate
